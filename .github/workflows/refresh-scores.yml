name: Refresh scores and deploy dashboard
on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
  push:
    branches: [main]
    paths: ['scripts/refresh_scores.py', 'scripts/build_tracker.py', 'scripts/embed_predictions.py', 'results.json', 'index.html', '.github/workflows/refresh-scores.yml']
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: public-score-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh final scores
        run: python scripts/refresh_scores.py
      - name: Generate scraper-friendly tracker files
        run: python scripts/build_tracker.py --source results.json --output tracker
      - name: Embed latest model picks in main page HTML
        run: python scripts/embed_predictions.py --source results.json --page index.html
      - name: Verify static predictions are current
        run: python scripts/embed_predictions.py --source results.json --page index.html --check
      - name: Save refreshed archive and static tracker files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results.json tracker index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh scores and static prediction tracker'
            git push origin HEAD:main
          fi
      - name: Stage public dashboard files
        run: |
          mkdir -p _site
          cp index.html app.js style.css results.json elo.json .nojekyll _site/
          cp -R tracker _site/tracker
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4
